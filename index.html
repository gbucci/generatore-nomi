<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Generatore Nomi Reali</title>
    <!-- 
      AGGIORNAMENTO PERCORSO:
      Diciamo al browser di entrare nella cartella 'css' prima di caricare il file.
    -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="container">
        <div class="input-section">
            <h2>Generatore Nomi</h2>
            
            <label for="inputStr">Le tue lettere di partenza:</label>
            <input type="text" id="inputStr" placeholder="Es. Mario Rossi">

            <label for="maxJolly">Jolly massimi (differenze consentite):</label>
            <input type="number" id="maxJolly" min="0" max="20" value="4">

            <label for="language">Scegli la lingua:</label>
            <select id="language">
                <option value="it">Italiano</option>
                <option value="en">Inglese</option>
                <option value="mix">Misto (Casuale)</option>
            </select>

            <label for="numResults">Numero di risultati (1-20):</label>
            <input type="number" id="numResults" min="1" max="20" value="5">

            <button id="searchBtn" onclick="findRealNames()" disabled>Caricamento DB in corso...</button>
        </div>

        <div class="results-section">
            <h2>Risultati trovati</h2>
            <div id="result-list">
                <p style="color: #777;"><em>I risultati appariranno qui...</em></p>
            </div>
        </div>
    </div>

    <!-- 
      AGGIORNAMENTO PERCORSO:
      Diciamo al browser di entrare nella cartella 'js' prima di caricare il file.
    -->
    <script src="js/script.js"></script>
</body>
</html>
